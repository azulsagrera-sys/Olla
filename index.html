<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>olla</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="olla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F2F2F7; --group:#FFFFFF; --fill:#E5E5EA; --ink:#111113; --muted:#8A8A8F; --sep:rgba(60,60,67,.16);
  --brand:#FF6A1A; --brand-soft:#FFEEE4; --brand-text:#E4560B; --danger:#E5372E; --ok:#2FB457; --warn:#E59A0B;
  --bar:rgba(246,246,248,.82); --seg-on:#FFFFFF; --scrim:rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --group:#1C1C1E; --fill:#2C2C2E; --ink:#FFFFFF; --muted:#9A9AA0; --sep:rgba(84,84,88,.6);
    --brand:#FF7A2E; --brand-soft:#3B2213; --brand-text:#FF9150; --danger:#FF5147; --ok:#32D74B; --warn:#FFC23D;
    --bar:rgba(18,18,20,.82); --seg-on:#5A5A5F; --scrim:rgba(0,0,0,.6); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --group:#1C1C1E; --fill:#2C2C2E; --ink:#FFFFFF; --muted:#9A9AA0; --sep:rgba(84,84,88,.6);
  --brand:#FF7A2E; --brand-soft:#3B2213; --brand-text:#FF9150; --danger:#FF5147; --ok:#32D74B; --warn:#FFC23D;
  --bar:rgba(18,18,20,.82); --seg-on:#5A5A5F; --scrim:rgba(0,0,0,.6); --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;padding-bottom:96px;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:26;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Barra superior compacta */
.navbar{position:fixed;top:0;left:0;right:0;z-index:25;padding-top:env(safe-area-inset-top,0px);transition:background .2s,border-color .2s;border-bottom:.5px solid transparent;pointer-events:none}
.navbar .in{height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;opacity:0;transition:opacity .2s}
.navbar.show{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.navbar.show .in{opacity:1}

/* Título grande */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 14px}
.lt h1{font-size:2.125rem;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:0}
.lt .sub{color:var(--muted);font-size:.95rem;margin:3px 0 0}
.brand{display:flex;align-items:center;gap:6px;color:var(--brand-text);font-family:var(--round);font-weight:800;font-size:1rem;margin-bottom:4px;letter-spacing:-.01em}
.brand svg{width:20px;height:20px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--group);color:var(--brand-text);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:21px;height:21px}

/* Tira de días */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 20px}
.dchip{border:0;background:var(--group);border-radius:16px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);transition:transform .12s}
.dchip .dl{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.dchip .dn{font-size:1.15rem;font-weight:800;line-height:1}
.dots{display:flex;gap:3px;height:5px;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fill)}
.dots i.on{background:var(--brand)}
.dchip.today .dn,.dchip.today .dl{color:var(--brand-text)}
.dchip.sel{background:var(--brand);box-shadow:0 6px 16px -6px var(--brand)}
.dchip.sel .dl,.dchip.sel .dn{color:#fff}
.dchip.sel .dots i{background:rgba(255,255,255,.35)}
.dchip.sel .dots i.on{background:#fff}

/* Día seleccionado */
.day-h{display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:800;letter-spacing:-.015em;margin:0 2px 12px}
.badge{font-size:.72rem;font-weight:800;color:#fff;background:var(--brand);border-radius:99px;padding:3px 9px;letter-spacing:.02em}
.meal{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--group);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s}
.micon{width:48px;height:48px;border-radius:15px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.micon svg{width:24px;height:24px}
.mbody{flex:1;min-width:0;display:flex;flex-direction:column}
.mk{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.mn{font-size:1.14rem;font-weight:700;line-height:1.25;margin-top:3px;letter-spacing:-.01em}
.mm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.85rem;color:var(--muted);margin-top:6px}
.mm span{display:inline-flex;align-items:center;gap:4px}
.mm svg{width:14px;height:14px}
.chev{color:var(--muted);opacity:.6}
.chev svg{width:18px;height:18px}
.meal.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--sep)}
.meal.empty .micon{background:var(--fill);color:var(--muted)}
.meal.empty .mn{color:var(--brand-text)}
.tag{font-size:.72rem;font-weight:800;color:var(--brand-text);background:var(--brand-soft);border-radius:7px;padding:2px 7px}

/* Listas agrupadas */
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 16px 7px}
.gf{font-size:.8rem;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.group{background:var(--group);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.group>.inset-lg+*::before,.group>*+.inset-lg::before{left:62px}
.arow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:13px 16px;text-align:left;font-size:1rem;color:var(--brand-text);font-weight:600;min-height:48px}
.arow svg{width:22px;height:22px}
.arow.danger{color:var(--danger)}
.arow:active,.prow:active,.ov-row:active{background:var(--fill)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:52px}
.vrow .lbl{flex:1}
.vrow .lbl small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;line-height:1.35}

/* Resumen de la semana */
.ov-row{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px 11px 16px}
.ov-day{font-weight:800;font-size:1rem;line-height:1.1}
.ov-day small{display:block;font-weight:600;color:var(--muted);font-size:.8rem;margin-top:2px}
.ov-row.today .ov-day{color:var(--brand-text)}
.ov-row.sel{background:var(--brand-soft)}
.ov-meals{min-width:0;display:flex;flex-direction:column;gap:3px}
.ov-meals span{display:flex;align-items:center;gap:6px;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ov-meals span b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ov-meals svg{width:14px;height:14px;color:var(--muted)}
.ov-meals .none b{color:var(--muted)}

/* Compras */
.summary{display:flex;align-items:center;gap:16px;background:var(--group);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.ring{width:60px;height:60px;flex:none;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;font-weight:800}
.summary .big{font-size:1.3rem;font-weight:800;letter-spacing:-.015em;margin:0}
.summary .small{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-top:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)}.status.offline i,.status.connecting i{background:var(--warn)}.status.error i,.status.missing i,.status.config i{background:var(--danger)}
.item{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;min-height:50px}
.item label{flex:1;display:flex;align-items:center;gap:13px;padding:12px 0;cursor:pointer;min-width:0}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--sep);border-radius:50%;flex:none;display:grid;place-items:center;margin:0;transition:background .15s,border-color .15s}
.item input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
.item input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .name{flex:1;min-width:0}
.item .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.item.done .name,.item.done .q{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.gh button{border:0;background:transparent;color:var(--brand-text);font-weight:600;font-size:.8rem;text-transform:none;letter-spacing:0;padding:0}
.addrow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px}
.addrow input{flex:1;border:0;background:transparent;padding:10px 0;min-width:0;font-size:1rem}
.addrow input:focus{outline:none}
.addrow select{border:0;background:var(--fill);border-radius:10px;padding:7px 8px;font-size:.85rem;max-width:42%}
.plus-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.plus-btn svg{width:18px;height:18px}

/* Ajustes */
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:10px;padding:2px}
.stepper button{width:38px;height:32px;border:0;background:transparent;border-radius:8px;font-size:1.2rem;font-weight:600;display:grid;place-items:center}
.stepper button:active{background:var(--group)}
.stepper output{min-width:2ch;text-align:center;font-weight:700}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;margin:0;flex:none;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.sw:checked{background:var(--brand)}
.sw:checked::after{transform:translateX(20px)}
.app-foot{text-align:center;color:var(--muted);font-size:.8rem;margin:28px 0 8px}
.app-foot .brand{justify-content:center;margin-bottom:2px}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs button{flex:1;max-width:160px;border:0;background:transparent;padding:4px 0;font-weight:600;font-size:.66rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;letter-spacing:.01em}
nav.tabs svg{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--brand-text)}
nav.tabs .count{position:absolute;top:0;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:99px;font-size:.66rem;font-weight:700;padding:1px 6px;min-width:19px;text-align:center}

/* Hojas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:14px 14px 0 0;max-height:93vh;max-height:93dvh;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px;padding:8px 12px 4px;display:flex;align-items:center;justify-content:center;touch-action:none;min-height:44px}
.grab{width:36px;height:5px;border-radius:9px;background:var(--fill)}
.close{position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);display:grid;place-items:center}
.close svg{width:14px;height:14px}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--brand-text);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 4px}
.sheet h3{font-size:1.65rem;margin:0 0 12px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill2{display:inline-flex;align-items:center;gap:6px;background:var(--group);border-radius:99px;padding:7px 12px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow)}
.pill2 svg{width:16px;height:16px;color:var(--brand-text)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:12px 16px}
.ing span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 16px;align-items:start}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 10px;height:40px;margin:2px 0 12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font-size:1rem;min-width:0}
.search input:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--group);color:var(--ink);border-radius:99px;padding:9px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;box-shadow:var(--shadow)}
.chip svg{width:16px;height:16px;color:var(--brand-text)}
.prow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:12px 12px 12px 16px;min-height:52px}
.prow .pn{flex:1;min-width:0}
.prow .pt{color:var(--muted);font-size:.85rem;white-space:nowrap}
.empty-note{color:var(--muted);padding:16px;text-align:center}
.field{width:100%;border:0;background:var(--group);border-radius:12px;padding:12px 14px}

/* Avisos */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:.92rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.update{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--group);color:var(--ink);padding:10px 10px 10px 16px;border-radius:18px;font-weight:600;max-width:560px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.update button{border:0;background:var(--brand);color:#fff;border-radius:99px;padding:9px 16px;font-weight:700}
.meal:active,.dchip:active,.chip:active,.icon-btn:active{transform:scale(.97)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{flex:1;display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:.88rem;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;transition:background .2s}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script>try{const t=localStorage.getItem('olla-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
<header class="navbar" id="navbar"><div class="in" id="navTitle">Semana</div></header>

<main class="wrap">
  <section class="view" id="v-semana" aria-label="Semana"></section>
  <section class="view" id="v-compras" aria-label="Compras" hidden></section>
  <section class="view" id="v-ajustes" aria-label="Ajustes" hidden></section>
</main>

<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</button>

function fmtNum(x){
  if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x));
  const w=Math.floor(x),f=x-w;
  if(Math.abs(f-.5)<1e-9)return(w?w:'')+'½';
  return x.toFixed(1).replace('.',',');
}
function qtyText(q,u){

  if(u==='ml'&&q>=1000)return fmtNum(Math.round(q/100)/10)+' l';
  const p=UNITS[u]||[u,u];return fmtNum(q)+' '+(q>1?p[1]:p[0]);
}
function roundDetail(q,u){if(u==='g'||u==='ml')return Math.max(10,Math.round(q/10)*10);return Math.max(.5,Math.round(q*2)/2)}
function roundBuy(q,u){if(u==='g'||u==='ml')return q<=50?Math.ceil(q/10)*10:Math.ceil(q/50)*50;return Math.ceil(q-1e-9)}
function dinnerMultiplier(d){const n=S.slots[(d+1)+'-a'];return(d<6&&n==='sobras')?2:1}
function slotFactor(key){const[d,m]=key.split('-');let f=S.people/2;if(m==='c')f*=dinnerMultiplier(+d);return f}
function buildList(){

}

function setTheme(t){
  try{t==='auto'?localStorage.removeItem('olla-tema'):localStorage.setItem('olla-tema',t)}catch(e){}
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  const metas=document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m=>{const dark=(m.getAttribute('media')||'').includes('dark');m.setAttribute('content',t==='auto'?(dark?'#000000':'#F2F2F7'):(t==='dark'?'#000000':'#F2F2F7'))});
}
setTheme(getTheme());

/* ---------- Semana ---------- */
function mealCard(key){
  const lunch=key.endsWith('-a');const kind=lunch?'Almuerzo':'Cena';
  if(!filled(key))return '<button class="meal empty" data-slot="'+key+'"><span class="micon">'+IC.plus+'</span><span class="mbody"><span class="mk">'+kind+'</span><span class="mn">Agregar '+kind.toLowerCase()+'</span></span></button>';
  const v=S.slots[key],r=RB[v];let meta;
  if(r){meta='<span>'+IC.clock+r.t+'</span>'+(r.mine?'<span class="tag">Tuya</span>':'')+(!lunch&&dinnerMultiplier(+key[0])===2?'<span class="tag">Cocinás doble</span>':'')}
  else meta='<span>No hay que cocinar</span>';
  return '<button class="meal" data-slot="'+key+'"><span class="micon">'+(lunch?IC.sun:IC.moon)+'</span><span class="mbody"><span class="mk">'+kind+'</span><span class="mn">'+esc(slotName(key))+'</span><span class="mm">'+meta+'</span></span><span class="chev">'+IC.chev+'</span></button>';
}
function renderWeek(){
  const start=fromIso(S.start);const end=new Date(start);end.setDate(end.getDate()+6);
  const range='Del '+start.getDate()+(start.getMonth()!==end.getMonth()?' de '+MONTHS[start.getMonth()]:'')+' al '+end.getDate()+' de '+MONTHS[end.getMonth()];
  const ti=todayIndex();
  if(selDay===null||selDay<0||selDay>6)selDay=(ti>=0&&ti<=6)?ti:0;
  let h='<div class="lt"><div><div class="brand">'+IC.pot+'olla</div><h1>Semana</h1><p class="sub">'+range+'</p></div><button class="icon-btn" id="suggestTop" aria-label="Sugerir menús para los vacíos">'+IC.sparkle+'</button></div>';
  h+='<div class="strip" role="tablist" aria-label="Días">';
  for(let d=0;d<7;d++){
    const dt=new Date(start);dt.setDate(dt.getDate()+d);
    h+='<button role="tab" aria-selected="'+(d===selDay)+'" class="dchip'+(d===ti?' today':'')+(d===selDay?' sel':'')+'" data-day="'+d+'" aria-label="'+DAYS[d]+' '+dt.getDate()+'"><span class="dl">'+DL[d]+'</span><span class="dn">'+dt.getDate()+'</span><span class="dots"><i class="'+(filled(d+'-a')?'on':'')+'"></i><i class="'+(filled(d+'-c')?'on':'')+'"></i></span></button>';
  }
  h+='</div>';
  const sd=new Date(start);sd.setDate(sd.getDate()+selDay);
  h+='<h2 class="day-h">'+cap(DAYS[selDay])+' '+sd.getDate()+(selDay===ti?' <span class="badge">Hoy</span>':'')+'</h2>';
  h+=mealCard(selDay+'-a')+mealCard(selDay+'-c');
  h+='<div class="gh"><span>Toda la semana</span></div><div class="group">';
  for(let d=0;d<7;d++){
    const dt=new Date(start);dt.setDate(dt.getDate()+d);
    const line=(k,ic)=>'<span class="'+(filled(k)?'':'none')+'">'+ic+'<b>'+esc(filled(k)?slotName(k):'Sin elegir')+'</b></span>';
    h+='<button class="ov-row'+(d===ti?' today':'')+(d===selDay?' sel':'')+'" data-day="'+d+'"><span class="ov-day">'+DABBR[d]+'<small>'+dt.getDate()+'</small></span><span class="ov-meals">'+line(d+'-a',IC.sun)+line(d+'-c',IC.moon)+'</span><span class="chev">'+IC.chev+'</span></button>';
  }
  h+='<button class="arow" data-act="suggest">'+IC.sparkle+'Completar vacíos con sugerencias</button></div>';
  h+='<p class="gf">Cada lunes la semana arranca en blanco. Tocá cualquier comida para elegirla.</p>';
  $('v-semana').innerHTML=h;
}

/* ---------- Compras ---------- */
let showPantry=false;
function renderList(){
  const items=buildList();
  const extras=S.extras.map(e=>({key:'x:'+e.id,name:e.name,sec:e.sec,extra:e.id}));
  const all=items.concat(extras);
  const countable=all.filter(x=>x.sec!=='alacena');
  const done=countable.filter(x=>S.checked[x.key]).length;
  const left=countable.length-done;
  const tc=$('tabCount');tc.hidden=left===0;tc.textContent=left;
  const pct=countable.length?Math.round(done/countable.length*100):0;
  const C=2*Math.PI*25;
  const st=syncStatus();
  let h='<div class="lt"><div><h1>Compras</h1><p class="sub">Sale sola de los menús de la semana</p></div><button class="icon-btn" id="shareBtn" aria-label="Compartir lista">'+IC.share+'</button></div>';
  h+='<div class="summary"><div class="ring"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="var(--fill)" stroke-width="6"/><circle cx="30" cy="30" r="25" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct/100)).toFixed(1)+'" style="transition:stroke-dashoffset .4s"/></svg><span class="pct">'+pct+'%</span></div><div>'+
    (countable.length?'<p class="big">'+(left?'Te faltan '+left:'¡Ya tenés todo!')+'</p><p class="small">'+done+' de '+countable.length+' en el changuito</p>':'<p class="big">Lista vacía</p><p class="small">Elegí menús y la lista se arma sola</p>')+
    (hogar()?'<span class="status '+st+'"><i></i>'+SYNC_TEXT[st]+'</span>':'')+'</div></div>';
  for(const s of SECTORS){
    const xs=all.filter(x=>x.sec===s.id).sort((a,b)=>a.name.localeCompare(b.name,'es'));
    if(!xs.length)continue;
    const pantry=s.id==='alacena';
    h+='<div class="gh"><span>'+s.name+'</span>'+(pantry?'<button data-act="pantry">'+(showPantry?'Ocultar':'Ver '+xs.length)+'</button>':'<span>'+xs.filter(x=>!S.checked[x.key]).length+'</span>')+'</div>';
    if(pantry&&!showPantry)continue;
    h+='<div class="group">'+xs.map(x=>{const ck=!!S.checked[x.key];
      return '<div class="item'+(ck?' done':'')+'"><label><input type="checkbox" data-key="'+esc(x.key)+'"'+(ck?' checked':'')+'><span class="name">'+esc(x.name)+'</span>'+(x.u?'<span class="q">'+qtyText(x.q,x.u)+'</span>':'')+'</label>'+(x.extra!==undefined?'<button class="x" data-rm="'+esc(x.extra)+'" aria-label="Quitar '+esc(x.name)+'">'+IC.x+'</button>':'')+'</div>'}).join('')+'</div>';
  }
  h+='<div class="gh"><span>Agregar algo más</span></div><div class="group"><div class="addrow"><input id="exName" placeholder="Yerba, detergente…" aria-label="Producto" enterkeyhint="done"><select id="exSec" aria-label="Sector">'+SECTORS.filter(s=>s.id!=='alacena').map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')+'</select><button class="plus-btn" id="exAdd" aria-label="Agregar">'+IC.plus+'</button></div></div>';
  if(done)h+='<div class="group" style="margin-top:20px"><button class="arow" data-act="uncheck">'+IC.undo+'Desmarcar todo</button></div>';
  const old=$('exName');const keep=old?{v:old.value,f:document.activeElement===old,s:$('exSec').value}:null;
  $('v-compras').innerHTML=h;
  if(keep){const n=$('exName');n.value=keep.v;$('exSec').value=keep.s;if(keep.f)n.focus({preventScroll:true})}
}

/* ---------- Hojas ---------- */
const sheet=$('sheet'),scrim=$('scrim'),body=$('sheetBody');
let lastFocus=null,curSlot=null;
function openSheet(html){lastFocus=document.activeElement;body.innerHTML=html;sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');document.body.style.overflow='hidden'}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');document.body.style.overflow='';curSlot=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})}
scrim.onclick=closeSheet;
$('closeSheet').onclick=closeSheet;
(function(){const head=$('sheetHead');let y0=null,dy=0;
 head.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sheet.style.transition='none'},{passive:true});
 head.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform='translateY('+dy+'px)'},{passive:true});
 head.addEventListener('touchend',()=>{sheet.style.transition='';sheet.style.transform='';if(dy>90)closeSheet();y0=null;dy=0});
})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('on'))closeSheet()});

function openSlot(key){if(!filled(key)){curSlot=key;showPicker()}else showSlot(key)}
function showSlot(key){
  curSlot=key;const v=S.slots[key];const r=RB[v];const lunch=key.endsWith('-a');let h='<p class="eyebrow">'+slotTitle(key)+'</p>';
  if(r){
    const f=slotFactor(key);const portions=Math.round(f*2);
    h+='<h3>'+esc(r.n)+'</h3><div class="pills"><span class="pill2">'+IC.clock+r.t+'</span><span class="pill2">'+IC.people+portions+' porciones</span>'+(r.mine?'<span class="pill2">'+IC.pot+'Tuya</span>':'')+'</div>';
    if(f>S.people/2)h+='<p class="gf" style="margin-left:2px">Incluye las sobras para el almuerzo de mañana.</p>';
    h+='<div class="gh"><span>Ingredientes</span></div><div class="group">'+r.i.map(it=>'<div class="ing"><span>'+esc(it.name)+'</span><span>'+qtyText(roundDetail(it.q*f,it.u),it.u)+'</span></div>').join('')+'</div><p class="gf">Aceite, sal y pimienta se dan por hechos.</p>';
    h+='<div class="gh"><span>Preparación</span></div><div class="group">'+r.s.map((s,i)=>'<div class="step"><span class="num">'+(i+1)+'</span><span>'+esc(s)+'</span></div>').join('')+'</div>';
  }else{
    h+='<h3>'+esc(slotName(key))+'</h3><p class="gf" style="margin-left:2px">No suma nada a la lista de compras.</p>';
  }
  h+='<div class="gh"><span>Cambiar</span></div><div class="group"><button class="arow" data-act="pick">'+IC.list+'Elegir otra receta</button><button class="arow" data-act="random">'+IC.shuffle+'Otra al azar</button>';
  if(lunch&&key!=='0-a'&&v!=='sobras')h+='<button class="arow" data-act="sobras">'+IC.box+'Sobras de la cena</button>';
  if(v!=='afuera')h+='<button class="arow" data-act="afuera">'+IC.fork+'Comemos afuera</button>';
  h+='<button class="arow danger" data-act="clear">'+IC.trash+'Quitar del plan</button></div>';
  openSheet(h);
}
function showPicker(){
  const lunch=curSlot.endsWith('-a');
  let h='<p class="eyebrow">Elegí</p><h3>'+(lunch?'Almuerzo':'Cena')+' del '+DAYS[+curSlot[0]]+'</h3>'+
    '<div class="search">'+IC.search+'<input id="q" type="search" placeholder="Buscar receta o ingrediente" aria-label="Buscar"></div>'+
    '<div class="chips"><button class="chip" data-act="random">'+IC.shuffle+'Al azar</button>'+(lunch&&curSlot!=='0-a'?'<button class="chip" data-act="sobras">'+IC.box+'Sobras de la cena</button>':'')+'<button class="chip" data-act="afuera">'+IC.fork+'Comemos afuera</button></div><div id="pickList"></div>';
  openSheet(h);
  const draw=q=>{q=(q||'').toLowerCase().trim();
    const match=R.filter(r=>!q||r.n.toLowerCase().includes(q)||r.i.some(i=>i.name.toLowerCase().includes(q)));
    const grp=(title,xs)=>xs.length?'<div class="gh"><span>'+title+'</span></div><div class="group">'+xs.map(r=>'<button class="prow" data-choose="'+r.id+'"><span class="pn">'+esc(r.n)+'</span><span class="pt">'+r.t+'</span><span class="chev">'+IC.chev+'</span></button>').join('')+'</div>':'';
    $('pickList').innerHTML=(grp('Tus recetas',match.filter(r=>r.mine))+grp('Sugeridas',match.filter(r=>!r.mine)))||'<p class="empty-note">No hay recetas con ese nombre o ingrediente.</p>'};
  draw('');$('q').oninput=e=>draw(e.target.value);
}
sheet.addEventListener('click',e=>{
  const b=e.target.closest('#sheetBody button');if(!b)return;
  if(b.dataset.choose){S.slots[curSlot]=b.dataset.choose;commit([{p:['slots',curSlot],v:S.slots[curSlot]}]);render();showSlot(curSlot);return}
  const a=b.dataset.act;if(!a)return;
  if(a==='random'){const used=new Set(Object.values(S.slots));const opts=R.filter(r=>!used.has(r.id));const pool=opts.length?opts:R.filter(r=>r.id!==S.slots[curSlot]);S.slots[curSlot]=pool[Math.floor(Math.random()*pool.length)].id;commit([{p:['slots',curSlot],v:S.slots[curSlot]}]);render();showSlot(curSlot)}
  else if(a==='pick')showPicker();
  else if(a==='sobras'||a==='afuera'){S.slots[curSlot]=a;commit([{p:['slots',curSlot],v:a}]);render();closeSheet()}
  else if(a==='clear'){S.slots[curSlot]=null;commit([{p:['slots',curSlot],v:null}]);render();closeSheet()}
});

/* ---------- Acciones de las vistas ---------- */
function suggest(){
  const keys=[...Array(7).keys()].flatMap(d=>[d+'-a',d+'-c']).filter(k=>!filled(k));
  if(!keys.length){toast('No quedan comidas vacías');return}
  const used=new Set(Object.values(S.slots));let pool=shuffle(R.filter(r=>!used.has(r.id)).map(r=>r.id));
  const ops=[];for(const k of keys){if(!pool.length)pool=shuffle(R.map(r=>r.id));S.slots[k]=pool.pop();ops.push({p:['slots',k],v:S.slots[k]})}
  commit(ops);render();toast('Completé '+keys.length+(keys.length===1?' comida':' comidas'));
}
$('v-semana').addEventListener('click',e=>{
  const s=e.target.closest('[data-slot]');if(s){openSlot(s.dataset.slot);return}
  const d=e.target.closest('[data-day]');if(d){selDay=+d.dataset.day;renderWeek();if(d.classList.contains('ov-row'))window.scrollTo({top:0,behavior:'smooth'});return}
  if(e.target.closest('#suggestTop')||e.target.closest('[data-act="suggest"]'))suggest();
});
$('v-compras').addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;if(e.target.checked){S.checked[k]=true;commit([{p:['checked',k],v:true}])}else{delete S.checked[k];commit([{p:['checked',k],del:true}])}renderList()});
$('v-compras').addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){const id=rm.dataset.rm;S.extras=S.extras.filter(x=>x.id!==id);delete S.checked['x:'+id];commit([{p:['extras'],v:S.extras},{p:['checked','x:'+id],del:true}]);renderList();return}
  if(e.target.closest('#exAdd'))addExtra();
  else if(e.target.closest('#shareBtn'))shareList();
  else if(e.target.closest('[data-act="pantry"]')){showPantry=!showPantry;renderList()}
  else if(e.target.closest('[data-act="uncheck"]')){S.checked={};commit([{p:['checked'],v:{}}]);renderList()}
});
$('v-compras').addEventListener('keydown',e=>{if(e.target.id==='exName'&&e.key==='Enter')addExtra()});
function addExtra(){const n=$('exName');const v=n.value.trim();if(!v){n.focus();return}S.extras.push({id:uid(),name:v,sec:$('exSec').value});commit([{p:['extras'],v:S.extras}]);n.value='';renderList();$('exName').focus()}

$('v-ajustes').addEventListener('change',e=>{
  if(e.target.id!=='sobSw')return;const v=e.target.checked;S.sobras=v;
  for(let d=1;d<7;d++){const k=d+'-a';if(v&&!filled(k))S.slots[k]='sobras';if(!v&&S.slots[k]==='sobras')S.slots[k]=null}
  commit([{p:['sobras'],v:S.sobras},{p:['slots'],v:S.slots}]);renderWeek();renderList();
});
$('v-ajustes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.theme){setTheme(b.dataset.theme);renderSettings();return}
  if(b.dataset.p){S.people=Math.min(12,Math.max(1,S.people+(+b.dataset.p)));$('pp').textContent=S.people;commit([{p:['people'],v:S.people}]);renderList();return}
  const a=b.dataset.act;
  if(a==='create'){if(!window.ollaSync){toast('Todavía cargando, probá en unos segundos');return}b.disabled=true;window.ollaSync.create().then(()=>{renderSettings();invite()}).catch(err=>{b.disabled=false;toast(err&&err.message==='config'?'Falta configurar Firebase':'No se pudo crear. Revisá tu conexión')})}
  else if(a==='join'){if(!window.ollaSync){toast('Todavía cargando, probá en unos segundos');return}const code=extractCode(prompt('Pegá el link que te pasaron'));if(code===null)return;if(!code){toast('Ese link no es de una lista de olla');return}if(!confirm('Tu semana y tu lista se reemplazan por las compartidas. ¿Seguimos?'))return;window.ollaSync.join(code).then(renderSettings).catch(err=>toast(err&&err.message==='config'?'Falta configurar Firebase':'No se pudo conectar'))}
  else if(a==='invite')invite();
  else if(a==='leave'){if(!confirm('Vas a dejar de ver la lista compartida. Te queda una copia en este celu.'))return;window.ollaSync&&window.ollaSync.leave();renderSettings()}
  else if(a==='clearWeek'){if(!confirm('Se borran todos los menús de esta semana y los tildes de la lista. ¿Seguimos?'))return;S.slots=blankWeek(S.sobras);S.checked={};commit([{p:['slots'],v:S.slots},{p:['checked'],v:{}}]);render();toast('Semana vacía, lista para completar')}
  else if(a==='backup')backup();
  else if(a==='restore')$('restoreFile').click();
});

async function backup(){
  const d=new Date();const name='olla-respaldo-'+iso(d)+'.json';
  const blob=new Blob([JSON.stringify({app:'olla',v:1,saved:d.toISOString(),data:S},null,1)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Respaldo de olla'});toast('Copia lista');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Copia descargada')}
  catch(e){toast('No se pudo guardar la copia')}
}
$('restoreFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const obj=JSON.parse(await f.text());const data=obj&&obj.data?obj.data:obj;if(!valid(data))throw 0;
    if(!confirm('Esto reemplaza tu semana y tu lista actuales por las de la copia. ¿Seguimos?'))return;
    S=normalize(data);fixMissing();commit([{full:true}]);render();toast('Copia restaurada')}
  catch(err){toast('Ese archivo no es una copia de olla')}
});

const TITLES={semana:'Semana',compras:'Compras',ajustes:'Ajustes'};

  for(const k in TITLES)$('v-'+k).hidden=k!==t;
  $('navTitle').textContent=TITLES[t];
  window.scrollTo(0,0);onScroll();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function onScroll(){$('navbar').classList.toggle('show',window.scrollY>56)}
window.addEventListener('scroll',onScroll,{passive:true});

function listText(){
  const all=buildList().concat(S.extras.map(e=>({key:'x:'+e.id,name:e.name,sec:e.sec})));
  let t='Compras de la semana\n';
  for(const s of SECTORS){if(s.id==='alacena')continue;const xs=all.filter(x=>x.sec===s.id&&!S.checked[x.key]).sort((a,b)=>a.name.localeCompare(b.name,'es'));if(!xs.length)continue;t+='\n'+s.name+'\n'+xs.map(x=>'- '+x.name+(x.u?' ('+qtyText(x.q,x.u)+')':'')).join('\n')+'\n'}
  return t;
}
async function shareList(){
  const t=listText();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Lista copiada')}catch(e){openSheet('<h3>Copiá tu lista</h3><textarea class="field" style="height:50vh" readonly>'+esc(t)+'</textarea>')}
}
function extractCode(t){if(t===null||t===undefined)return null;t=String(t).trim();const m=t.match(/hogar=([a-z0-9]{24,})/i)||t.match(/^([a-z0-9]{24,})$/i);return m?m[1].toLowerCase():''}
async function invite(){const code=hogar();if(!code)return;const url=location.origin+location.pathname+'#hogar='+code;
  try{if(navigator.share){await navigator.share({title:'olla',text:'Sumate a nuestra lista de comidas y compras en olla. Instalá la app y en Ajustes tocá “Unirme con un link”:',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch(e){openSheet('<h3>Link para invitar</h3><textarea class="field" style="height:120px" readonly>'+esc(url)+'</textarea>')}}
let tt;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1900)}

function maybeRollover(){
  const mon=iso(mondayOf(new Date()));
  if(!(fromIso(S.start)<fromIso(mon)))return false;
  S.start=mon;S.slots=blankWeek(S.sobras);S.extras=S.extras.filter(e=>!S.checked['x:'+e.id]);S.checked={};selDay=null;
  commit([{p:['start'],v:S.start},{p:['slots'],v:S.slots},{p:['extras'],v:S.extras},{p:['checked'],v:{}}]);
  return true;
}
let lastCheck=0;
async function checkUpdate(){if(location.protocol!=='https:')return;const now=Date.now();if(now-lastCheck<120000)return;lastCheck=now;
  try{const r=await fetch('index.html?check='+now,{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const APP_V='([^']+)'/);if(m&&m[1]!==APP_V)$('update').hidden=false}catch(e){}}
$('doUpdate').onclick=()=>location.reload();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(maybeRollover())render();else renderWeek();checkUpdate()}});
window.ollaHooks={getState:()=>S,setState:(d,fromCache)=>{S=normalize(d);fixMissing();if(!fromCache)maybeRollover();save();render()},onStatus:()=>{renderList();renderSettings()}};

maybeRollover();save();render();
setTimeout(checkUpdate,3000);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
<script type="module">
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const HKEY='olla-hogar';
const H=window.ollaHooks;
let F=null,db=null,ref=null,unsub=null,booting=null;
const sync={status:'local',apply,create,join,leave};
window.ollaSync=sync;
function setStatus(s){sync.status=s;H.onStatus(s)}
function getSaved(){try{return localStorage.getItem(HKEY)}catch(e){return null}}
function setSaved(c){try{c?localStorage.setItem(HKEY,c):localStorage.removeItem(HKEY)}catch(e){}}
function clean(o){return o===undefined?null:JSON.parse(JSON.stringify(o))}
function snapshotOf(S){return clean({people:S.people,sobras:S.sobras,start:S.start,slots:S.slots,checked:S.checked,extras:S.extras})}
function randomCode(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
function boot(){
  if(!booting){booting=(async()=>{
    const c=window.OLLA_CONFIG;if(!c||!c.apiKey||!c.projectId)throw new Error('config');
    const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=a.initializeApp(c);const auth=au.getAuth(app);
    await auth.authStateReady();if(!auth.currentUser)await au.signInAnonymously(auth);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    F=fs;
  })();booting.catch(()=>{booting=null})}
  return booting;
}
async function start(){setStatus('connecting');try{await boot()}catch(e){setStatus(e&&e.message==='config'?'config':'error');throw e}}
async function connect(code){
  await start();
  if(unsub)unsub();
  ref=F.doc(db,'hogares',code);
  unsub=F.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
    if(!snap.exists()){if(!snap.metadata.fromCache)setStatus('missing');return}
    if(!snap.metadata.hasPendingWrites)H.setState(snap.data(),snap.metadata.fromCache);
    setStatus(snap.metadata.fromCache?'offline':'ok');
  },()=>setStatus('error'));
}
function apply(ops){
  if(!ref||!F)return;
  if(ops.some(o=>o.full)){F.setDoc(ref,snapshotOf(H.getState())).catch(()=>{});return}
  const args=[];for(const o of ops)args.push(new F.FieldPath(...o.p),o.del?F.deleteField():clean(o.v));
  F.updateDoc(ref,...args).catch(()=>{});
}
async function create(){
  const code=randomCode();await start();
  await F.setDoc(F.doc(db,'hogares',code),snapshotOf(H.getState()));
  setSaved(code);await connect(code);return code;
}
async function join(code){setSaved(code);await connect(code)}
function leave(){if(unsub)unsub();unsub=null;ref=null;setSaved(null);setStatus('local')}

const saved=getSaved();
const m=location.hash.match(/hogar=([a-z0-9]{24,})/i);
if(m){
  history.replaceState(null,'',location.pathname+location.search);
  const code=m[1].toLowerCase();
  if(code!==saved&&confirm('Te invitaron a una lista compartida de olla. Tu semana y tu lista se reemplazan por las compartidas. ¿Te sumás?')){join(code).catch(()=>{})}
  else if(saved)connect(saved).catch(()=>{});
}else if(saved){connect(saved).catch(()=>{})}

</script>
