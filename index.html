<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>olla</title>
<meta name="theme-color" content="#FF5A1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="olla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#FFFFFF; --card:#FFF3EC; --ink:#1A1A1A; --muted:#8A7F78; --line:#F1E6DF;
  --brand:#FF5A1F; --on-brand:#FFFFFF; --brand-soft:#FFE4D6; --brand-text:#D9440F; --scrim:rgba(26,20,16,.45);
  --round:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --card:#221B17; --ink:#F5F2F0; --muted:#A39A94; --line:#2E2520;
    --brand:#FF6A2B; --on-brand:#FFFFFF; --brand-soft:#3A2418; --brand-text:#FF8A55; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --card:#221B17; --ink:#F5F2F0; --muted:#A39A94; --line:#2E2520;
  --brand:#FF6A2B; --on-brand:#FFFFFF; --brand-soft:#3A2418; --brand-text:#FF8A55; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:92px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 24px}
h1,h2,h3,h4,.r{font-family:var(--round)}

/* Hero */
.hero{background:var(--brand);color:var(--on-brand);border-radius:28px;padding:18px 20px 22px;margin-bottom:18px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.mark{font-family:var(--round);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;margin:0}
.mark svg{width:26px;height:26px}
.pill{border:0;background:rgba(255,255,255,.2);color:var(--on-brand);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.hero .lbl{font-size:.85rem;opacity:.85;font-weight:600;margin:0}
.hero .big{font-family:var(--round);font-weight:800;font-size:1.55rem;line-height:1.15;letter-spacing:-.02em;margin:2px 0 0}
.hero .meal+.meal{margin-top:12px}
.hero .sub{margin:16px 0 0;font-size:.9rem;opacity:.85}
.hero .hbar{height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:14px}
.hero .hbar span{display:block;height:100%;background:#fff;border-radius:9px;transition:width .25s}
.hero .btn{background:#fff;color:var(--brand-text);margin-top:14px}

.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:700;background:var(--brand);color:var(--on-brand)}
.btn.soft{background:var(--card);color:var(--ink)}
.btn.wide{width:100%}
.section-title{font-family:var(--round);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin:4px 2px 10px}

/* Semana */
.day{display:grid;grid-template-columns:50px 1fr;gap:10px;margin-bottom:10px}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--card);padding:8px 0;align-self:stretch}
.date .dn{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:lowercase}
.date .num{font-family:var(--round);font-weight:800;font-size:1.35rem;line-height:1.1}
.day.today .date{background:var(--brand);color:var(--on-brand)}
.day.today .date .dn{color:var(--on-brand);opacity:.9}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:10px 14px}
.slot .k{display:block;font-size:.75rem;color:var(--muted);font-weight:700}
.slot .v{display:block;font-weight:600}
.slot.empty{background:transparent;border:1.5px dashed var(--line)}
.slot.empty .v,.slot.soft .v{color:var(--muted);font-weight:500}
.slot.soft{background:transparent;border:1.5px solid var(--line)}
.tag{display:inline-block;margin-left:6px;font-size:.7rem;font-weight:800;color:var(--brand-text);background:var(--brand-soft);border-radius:8px;padding:1px 7px;vertical-align:2px;font-family:var(--sans)}

/* Compras */
.sector{margin:0 0 18px}
.sector h2{font-size:1rem;margin:0 2px 8px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.sector h2 small{font-family:var(--sans);color:var(--muted);font-weight:600;font-size:.85rem}
.items{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;overflow:hidden}
.items li{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-top:1px solid var(--bg);min-height:50px}
.items li:first-child{border-top:0}
.items label{flex:1;display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}
.items input[type=checkbox]{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;flex:none;display:grid;place-items:center;margin:0}
.items input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
.items input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.items .name{flex:1}
.items .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.items li.done .name,.items li.done .q{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:10px;font-size:1.2rem;line-height:1}
details.sector summary{list-style:none;cursor:pointer}
details.sector summary::-webkit-details-marker{display:none}
details.sector summary h2::after{content:"Ver";margin-left:auto;font-family:var(--sans);font-size:.85rem;color:var(--brand-text);font-weight:700}
details.sector[open] summary h2::after{content:"Ocultar"}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.field{border:0;background:var(--card);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.add select{grid-column:1/2}
.empty-state{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px;font-family:var(--round)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
nav.tabs button{flex:1;max-width:220px;border:0;background:transparent;border-radius:16px;padding:8px;font-weight:700;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--brand-text)}
nav.tabs .count{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brand);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 6px;min-width:20px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:28px 28px 0 0;max-height:88vh;max-height:88dvh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.sheethead{position:sticky;top:-8px;z-index:2;background:var(--bg);margin:-8px -18px 4px;padding:10px 12px 6px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line)}
.close{position:absolute;right:12px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);font-weight:700;display:grid;place-items:center}
.sheet h3{font-size:1.45rem;margin:4px 44px 2px 0;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.sheet .meta{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.sheet h4{margin:20px 0 6px;font-size:1rem;font-weight:800}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
ol.steps{padding-left:1.2em;margin:0}
ol.steps li{margin:0 0 8px}
ol.steps li::marker{color:var(--brand-text);font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.actions .full{grid-column:1/-1}
.pick{list-style:none;padding:0;margin:10px 0 0}
.pick button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 2px;display:flex;justify-content:space-between;gap:10px}
.pick button>span:last-child{color:var(--muted);font-size:.88rem;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);font-size:1.3rem;font-weight:700}
.stepper output{font-family:var(--round);font-size:2rem;font-weight:800;min-width:2ch;text-align:center}
.switch{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);margin-bottom:8px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--brand);margin:2px 0 0;flex:none}
.switch small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="v-semana" aria-label="Semana">
    <div class="hero" id="heroWeek"></div>
    <h2 class="section-title" id="weekLabel"></h2>
    <div id="days"></div>
    <button class="btn soft wide" id="newWeek" style="margin-top:8px">Armar semana nueva</button>
  </section>

  <section id="v-compras" aria-label="Compras" hidden>
    <div class="hero" id="heroList"></div>
    <div id="list"></div>
  </section>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</button>
  <button role="tab" aria-selected="false" data-tab="compras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.3 10.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Compras<span class="count" id="tabCount" hidden></span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle"><div class="sheethead" id="sheetHead"><div class="grab"></div><button class="close" id="closeSheet" aria-label="Cerrar">✕</button></div><div id="sheetBody"></div></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="vh" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
const POT='<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="3" rx="1.5"/><rect x="7" y="7.5" width="18" height="3" rx="1.5"/><rect x="3" y="11.5" width="26" height="3" rx="1.5"/><path d="M6 15.5h20v6.5a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6v-6.5Z"/></svg>';
const SECTORS=[
  {id:'verdu',name:'Verdulería'},
  {id:'carne',name:'Carnicería y pollería'},
  {id:'lacteo',name:'Lácteos, fiambres y huevos'},
  {id:'almacen',name:'Almacén'},
  {id:'pan',name:'Panadería'},
  {id:'alacena',name:'Revisá si tenés en casa'}
];
const R=[
 {id:'ensalada-ave',mine:1,n:'Ensalada de ave',t:'30 min',i:['Pechuga de pollo|300|g|carne','Lechuga|1|u|verdu','Tomate|2|u|verdu','Jamón cocido|100|g|lacteo','Huevo|2|u|lacteo','Arvejas|1|lata|almacen'],s:['Herví la pechuga en agua con sal unos 20 min y dejala enfriar. Herví los huevos 10 min.','Desmenuzá el pollo y cortá el jamón en tiras, el tomate y la lechuga.','Mezclá todo con las arvejas escurridas y el huevo duro en cuartos. Condimentá a gusto.']},
 {id:'revuelto-zapallitos',mine:1,n:'Revuelto de zapallitos con huevo cremoso',t:'20 min',i:['Zapallito|3|u|verdu','Cebolla|1|u|verdu','Huevo|4|u|lacteo'],s:['Cortá los zapallitos en cubos y la cebolla en pluma.','Saltealos a fuego medio hasta que estén tiernos.','Bajá el fuego, sumá los huevos batidos con sal y revolvé despacio hasta que queden cremosos.']},
 {id:'costeleta-ensalada',mine:1,n:'Costeleta con ensalada de lechuga y tomate',t:'20 min',i:['Costeleta|2|u|carne','Lechuga|1|u|verdu','Tomate|2|u|verdu'],s:['Cociná las costeletas en plancha o sartén bien caliente, 4–5 min por lado.','Salá al final.','Acompañá con lechuga y tomate.']},
 {id:'pechuga-limon',mine:1,n:'Pechugas al limón con ensalada',t:'25 min',i:['Pechuga de pollo|400|g|carne','Limón|2|u|verdu','Ajo|1|diente|verdu','Lechuga|1|u|verdu','Zanahoria|2|u|verdu','Huevo|2|u|lacteo'],s:['Mariná las pechugas con jugo de limón, ajo picado y sal mientras hervís los huevos 10 min.','Cocinalas en plancha 5–6 min por lado.','Serví con lechuga, zanahoria rallada y huevo duro.']},
 {id:'repollo-costeleta',mine:1,n:'Costeleta con repollo y huevo duro',t:'25 min',i:['Costeleta|2|u|carne','Repollo|0.5|u|verdu','Huevo|2|u|lacteo'],s:['Herví los huevos 10 min.','Cortá el repollo bien finito y condimentalo con aceite, sal y vinagre o limón.','Cociná las costeletas en plancha 4–5 min por lado y serví con el repollo y el huevo duro.']},
 {id:'fajitas',mine:1,n:'Fajitas de pollo con tus masitas',t:'40 min',i:['Harina de coco|90|g|almacen','PPP|90|g|almacen','Semillas|30|g|almacen','Aceite de oliva|4|cda|alacena','Pechuga de pollo|400|g|carne','Morrón|1|u|verdu','Cebolla|1|u|verdu','Pimentón|1|cdita|alacena'],s:['Masitas: mezclá la harina de coco, el PPP, la sal y las semillas. Sumá el aceite de oliva y ¾ taza de agua tibia y uní.','Dividí en bollitos, estiralos finitos y cocinalos en sartén caliente 1–2 min por lado.','Saltá el pollo en tiras con pimentón y sal; sumá morrón y cebolla en tiras hasta que estén tiernos.','Rellená las masitas y enrollá.']},
 {id:'pollo-calabaza',n:'Pollo con calabaza al horno',t:'35 min',i:['Pechuga de pollo|400|g|carne','Calabaza|500|g|verdu','Cebolla morada|1|u|verdu','Morrón|1|u|verdu','Romero seco|1|cda|alacena'],s:['Prendé el horno a 220 °C. Cortá la calabaza en cubos chicos y la cebolla y el morrón en trozos.','Horneá las verduras con aceite, romero y sal 15 min.','Sumá el pollo en cubos y horneá 15–20 min más, hasta que esté dorado.']},
 {id:'lentejas',n:'Lentejas guisadas con verduras',t:'40 min + remojo',i:['Lentejas|200|g|almacen','Cebolla|1|u|verdu','Morrón|1|u|verdu','Zanahoria|1|u|verdu','Zapallo|300|g|verdu','Puré de tomate|0.5|caja|almacen','Pimentón|1|cdita|alacena'],s:['Dejá las lentejas en remojo desde la mañana.','Rehogá cebolla, morrón y zanahoria picados.','Sumá zapallo en cubos, lentejas escurridas, puré de tomate, pimentón, sal y agua hasta cubrir. Cociná 25 min.']},
 {id:'ensalada',n:'Ensalada completa con huevo y queso',t:'20 min',i:['Lechuga|1|u|verdu','Tomate|2|u|verdu','Zanahoria|1|u|verdu','Huevo|3|u|lacteo','Queso cremoso|100|g|lacteo','Choclo amarillo|1|lata|almacen'],s:['Herví los huevos 10 min y enfrialos en agua.','Cortá lechuga y tomate y rallá la zanahoria.','Armá los platos con todo, el queso en cubos y el choclo. Condimentá con aceite, sal y limón o vinagre.']},
 {id:'wok',n:'Wok de pollo y verduras con arroz',t:'30 min',i:['Pechuga de pollo|400|g|carne','Arroz|160|g|almacen','Zanahoria|1|u|verdu','Morrón|1|u|verdu','Zucchini|1|u|verdu','Cebolla de verdeo|1|atado|verdu','Salsa de soja|3|cda|alacena'],s:['Cociná el arroz.','Cortá el pollo y las verduras en tiras finas.','Saltá el pollo a fuego fuerte, retiralo y saltá las verduras 4–5 min.','Volvé a sumar el pollo, agregá la soja y serví sobre el arroz.']},
 {id:'tortilla-espinaca',n:'Tortilla de espinaca al horno',t:'35 min',i:['Espinaca|1|atado|verdu','Cebolla|1|u|verdu','Huevo|5|u|lacteo','Queso rallado|30|g|lacteo','Tomate|2|u|verdu'],s:['Rehogá la cebolla y sumá la espinaca picada hasta que se achique.','Mezclá con los huevos batidos, el queso y sal.','Volcá en una fuente aceitada y horneá a 180 °C unos 20 min. Acompañá con tomate.']},
 {id:'cuadril-pure',n:'Cuadril a la plancha con puré de calabaza',t:'30 min',i:['Cuadril|400|g|carne','Calabaza|600|g|verdu'],s:['Herví la calabaza en cubos 15 min y pisala con sal y nuez moscada.','Cociná el cuadril en plancha bien caliente 4–5 min por lado y salá al final.','Serví con el puré.']},
 {id:'garbanzos',n:'Ensalada tibia de garbanzos',t:'15 min',i:['Garbanzos|1|lata|almacen','Tomate|2|u|verdu','Pepino|1|u|verdu','Cebolla morada|1|u|verdu','Huevo|2|u|lacteo','Limón|1|u|verdu'],s:['Herví los huevos 10 min.','Enjuagá los garbanzos y calentalos 3 min en sartén con un hilo de aceite.','Mezclá con tomate, pepino y cebolla morada picados y el huevo en cuartos. Condimentá con limón y sal.']},
 {id:'omelette',n:'Omelette de queso y tomate con rúcula',t:'15 min',i:['Huevo|4|u|lacteo','Queso cremoso|80|g|lacteo','Tomate|2|u|verdu','Rúcula|1|atado|verdu'],s:['Batí los huevos con sal.','Volcá en sartén caliente con aceite, poné queso y tomate en cubos sobre una mitad y doblá cuando cuaje.','Serví con rúcula y el resto del tomate.']},
 {id:'brochettes',n:'Brochettes de pollo y vegetales',t:'35 min',i:['Pechuga de pollo|400|g|carne','Morrón|1|u|verdu','Cebolla|1|u|verdu','Zucchini|1|u|verdu','Limón|1|u|verdu'],s:['Cortá todo en cubos y armá las brochettes intercalando.','Condimentá con limón, aceite y sal.','Cocinalas en plancha o al horno a 220 °C unos 20 min, girándolas.']},
 {id:'sopa-pollo',n:'Sopa de verduras con pollo',t:'40 min',i:['Pechuga de pollo|250|g|carne','Zanahoria|2|u|verdu','Zapallo|300|g|verdu','Papa|200|g|verdu','Cebolla|1|u|verdu','Apio|1|atado|verdu'],s:['Cortá las verduras en cubos chicos y el pollo en trozos.','Cubrí con 1 litro de agua con sal y cociná 30 min a fuego medio.','Serví bien caliente.']},

const RB=Object.fromEntries(R.map(r=>[r.id,r]));
const DAYS=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const DSHORT=['lun','mar','mié','jue','vie','sáb','dom'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const UNITS={u:['u.','u.'],g:['g','g'],ml:['ml','ml'],diente:['diente','dientes'],atado:['atado','atados'],lata:['lata','latas'],caja:['caja','cajas'],paq:['paquete','paquetes'],cda:['cda.','cdas.'],cdita:['cdita.','cditas.']};
const KEY='casa-comidas-v1';

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function generate(sobras){
  const pool=shuffle(R.map(r=>r.id));let k=0;const next=()=>pool[(k++)%pool.length];
  const slots={};
  for(let d=0;d<7;d++){slots[d+'-a']=(sobras&&d>0)?'sobras':next();slots[d+'-c']=next()}
  return slots;
}
function defaultState(){return{people:2,sobras:false,start:iso(mondayOf(new Date())),slots:generate(false),checked:{},extras:[]}}
function valid(x){return x&&typeof x==='object'&&x.slots&&typeof x.slots==='object'&&x.start&&Array.isArray(x.extras)}
let S;
try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!valid(S))S=defaultState();
function uid(){return Math.random().toString(36).slice(2,10)}
function normalize(x){const d=defaultState();const o={people:+x.people||2,sobras:!!x.sobras,start:x.start||d.start,slots:x.slots&&typeof x.slots==='object'?x.slots:d.slots,checked:x.checked&&typeof x.checked==='object'?x.checked:{},extras:Array.isArray(x.extras)?x.extras:[]};o.extras=o.extras.filter(e=>e&&e.name).map(e=>e.id?e:{...e,id:uid()});return o}
S=normalize(S);
function fixMissing(){const used=new Set(Object.values(S.slots));for(const k in S.slots){const v=S.slots[k];if(v&&v!=='sobras'&&v!=='afuera'&&!RB[v]){const free=R.filter(r=>!used.has(r.id));const pool=free.length?free:R;const p=pool[Math.floor(Math.random()*pool.length)];S.slots[k]=p.id;used.add(p.id)}}}
fixMissing();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function commit(ops){save();if(window.ollaSync)window.ollaSync.apply(ops)}
function hogar(){try{return localStorage.getItem('olla-hogar')}catch(e){return null}}
const SYNC_TEXT={local:'Ahora tu semana y tu lista están solo en este celu.',connecting:'Conectando…',ok:'Compartida y al día.',offline:'Sin conexión. Lo que cambies se sincroniza cuando vuelva.',missing:'No encontramos esa lista compartida. Pedí que te reenvíen el link.',error:'No se pudo conectar. Revisá tu conexión y volvé a abrir la app.',config:'Falta configurar Firebase en el archivo config.js.'};
function syncStatus(){return window.ollaSync?window.ollaSync.status:(hogar()?'connecting':'local')}
function syncLine(){if(!hogar())return '';const st=syncStatus();return '<p class="sub">'+(st==='ok'?'Lista compartida, al día':st==='offline'?'Sin conexión, se sincroniza al volver':SYNC_TEXT[st])+'</p>'}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function fmtNum(x){
  if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x));
  const w=Math.floor(x),f=x-w;
  if(Math.abs(f-.5)<1e-9)return(w?w:'')+'½';
  return x.toFixed(1).replace('.',',');
}
function qtyText(q,u){
  if(u==='g'&&q>=1000)return fmtNum(Math.round(q/100)/10)+' kg';
  if(u==='ml'&&q>=1000)return fmtNum(Math.round(q/100)/10)+' l';
  const p=UNITS[u]||[u,u];return fmtNum(q)+' '+(q>1?p[1]:p[0]);
}
function roundDetail(q,u){if(u==='g'||u==='ml')return Math.max(10,Math.round(q/10)*10);return Math.max(.5,Math.round(q*2)/2)}
function roundBuy(q,u){if(u==='g'||u==='ml')return q<=50?Math.ceil(q/10)*10:Math.ceil(q/50)*50;return Math.ceil(q-1e-9)}
function dinnerMultiplier(d){const n=S.slots[(d+1)+'-a'];return(d<6&&n==='sobras')?2:1}
function slotFactor(key){const[d,m]=key.split('-');let f=S.people/2;if(m==='c')f*=dinnerMultiplier(+d);return f}

function buildList(){
  const agg={};
  for(const key in S.slots){
    const r=RB[S.slots[key]];if(!r)continue;const f=slotFactor(key);
    for(const it of r.i){const k=it.name+'|'+it.u;(agg[k]||(agg[k]={name:it.name,u:it.u,sec:it.sec,q:0})).q+=it.q*f}
  }
  return Object.entries(agg).map(([k,v])=>({key:k,...v,q:roundBuy(v.q,v.u)}));
}

function slotLabel(key){
  const v=S.slots[key];
  if(v==='sobras')return{cls:'soft',t:'Sobras de la cena'};
  if(v==='afuera')return{cls:'soft',t:'Comemos afuera'};
  if(!v||!RB[v])return{cls:'empty',t:'Sin plan, tocá para elegir'};
  return{cls:'',t:RB[v].n};
}
function todayIndex(){const t=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-fromIso(S.start))/86400000)}

function renderWeek(){
  const start=fromIso(S.start);const end=new Date(start);end.setDate(end.getDate()+6);
  document.getElementById('weekLabel').textContent='Del '+start.getDate()+(start.getMonth()!==end.getMonth()?' de '+MONTHS[start.getMonth()]:'')+' al '+end.getDate()+' de '+MONTHS[end.getMonth()];
  const ti=todayIndex();
  let hero='<div class="hero-top"><p class="mark">'+POT+'olla</p><button class="pill" id="openSettings">Para '+S.people+'</button></div>';
  if(ti>=0&&ti<=6){
    hero+='<p class="lbl">Hoy almorzás</p><p class="big">'+esc(slotLabel(ti+'-a').t)+'</p><div class="meal"><p class="lbl">Y cenás</p><p class="big">'+esc(slotLabel(ti+'-c').t)+'</p></div>';
  }else if(ti>6){
    hero+='<p class="big">Esta semana ya terminó</p><p class="sub">Armá la de esta semana y la lista de compras se actualiza sola.</p><button class="btn" data-hero="new">Armar semana nueva</button>';
  }else{
    hero+='<p class="big">Tu semana empieza el '+DAYS[0]+' '+start.getDate()+'</p>';
  }
  document.getElementById('heroWeek').innerHTML=hero;
  let h='';
  for(let d=0;d<7;d++){
    const dt=new Date(start);dt.setDate(dt.getDate()+d);
    h+='<div class="day'+(d===ti?' today':'')+'"><div class="date"><span class="dn">'+DSHORT[d]+'</span><span class="num">'+dt.getDate()+'</span></div><div class="slots">';
    for(const m of ['a','c']){
      const key=d+'-'+m;const L=slotLabel(key);
      const dbl=(m==='c'&&RB[S.slots[key]]&&dinnerMultiplier(d)===2)?'<span class="tag">Cocinás doble</span>':'';
      h+='<button class="slot '+L.cls+'" data-slot="'+key+'"><span class="k">'+(m==='a'?'Almuerzo':'Cena')+'</span><span class="v">'+esc(L.t)+dbl+'</span></button>';
    }
    h+='</div></div>';
  }
  document.getElementById('days').innerHTML=h;
}

function renderList(){
  const items=buildList();
  const extras=S.extras.map(e=>({key:'x:'+e.id,name:e.name,sec:e.sec,extra:e.id}));
  const all=items.concat(extras);
  const countable=all.filter(x=>x.sec!=='alacena');
  const done=countable.filter(x=>S.checked[x.key]).length;
  const left=countable.length-done;
  const tc=document.getElementById('tabCount');tc.hidden=left===0;tc.textContent=left;
  const pct=countable.length?Math.round(done/countable.length*100):0;
  document.getElementById('heroList').innerHTML='<div class="hero-top"><p class="mark">'+POT+'Compras</p><button class="pill" id="share">Compartir</button></div>'+
    (countable.length?'<p class="lbl">'+done+' de '+countable.length+' en el changuito</p><p class="big">'+(left?'Te faltan '+left:'¡Ya tenés todo!')+'</p><div class="hbar"><span style="width:'+pct+'%"></span></div>':'<p class="big">Lista vacía</p><p class="sub">Elegí comidas en la semana y la lista se arma sola.</p>')+syncLine();
  let h='';
  for(const s of SECTORS){
    const xs=all.filter(x=>x.sec===s.id).sort((a,b)=>a.name.localeCompare(b.name,'es'));
    if(!xs.length)continue;
    const lis=xs.map(x=>{
      const ck=!!S.checked[x.key];
      return '<li class="'+(ck?'done':'')+'"><label><input type="checkbox" data-key="'+esc(x.key)+'"'+(ck?' checked':'')+'><span class="name">'+esc(x.name)+'</span>'+(x.u?'<span class="q">'+qtyText(x.q,x.u)+'</span>':'')+'</label>'+(x.extra!==undefined?'<button class="x" data-rm="'+esc(x.extra)+'" aria-label="Quitar '+esc(x.name)+'">×</button>':'')+'</li>';
    }).join('');
    const head='<h2>'+s.name+' <small>'+xs.length+'</small></h2>';
    if(s.id==='alacena')h+='<details class="sector"><summary>'+head+'</summary><ul class="items">'+lis+'</ul></details>';
    else h+='<div class="sector">'+head+'<ul class="items">'+lis+'</ul></div>';
  }
  h+='<div class="sector"><h2>Agregar algo más</h2><div class="add"><input class="field" id="exName" placeholder="Ej.: yerba, detergente" aria-label="Producto"><button class="btn" id="exAdd">Agregar</button><select class="field" id="exSec" aria-label="Sector">'+SECTORS.filter(s=>s.id!=='alacena').map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')+'</select></div></div>';
  if(done)h+='<button class="btn soft wide" id="uncheck">Desmarcar todo</button>';
  const old=document.getElementById('exName');const keep=old?{v:old.value,f:document.activeElement===old,s:document.getElementById('exSec').value}:null;
  document.getElementById('list').innerHTML=h;
  if(keep){const n=document.getElementById('exName');n.value=keep.v;document.getElementById('exSec').value=keep.s;if(keep.f)n.focus({preventScroll:true})}
}
function render(){renderWeek();renderList()}

const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),body=document.getElementById('sheetBody');
let lastFocus=null,curSlot=null;
function openSheet(html){lastFocus=document.activeElement;body.innerHTML=html;sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');const f=sheet.querySelector('#sheetBody button,#sheetBody input');if(f)f.focus({preventScroll:true})}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');curSlot=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})}

document.getElementById('closeSheet').onclick=closeSheet;
(function(){const head=document.getElementById('sheetHead');let y0=null,dy=0;
 head.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sheet.style.transition='none'},{passive:true});

function slotTitle(key){const[d,m]=key.split('-');return(m==='a'?'Almuerzo':'Cena')+' del '+DAYS[+d]}
function showSlot(key){
  curSlot=key;const v=S.slots[key];const r=RB[v];let h='';
  if(r){
    const f=slotFactor(key);const portions=Math.round(f*2);
    h+='<h3>'+esc(r.n)+(r.mine?' <span class="tag">Tuya</span>':'')+'</h3><p class="meta">'+slotTitle(key)+'. '+r.t+', '+portions+' porciones'+(f>S.people/2?' (incluye las sobras de mañana)':'')+'.</p>';
    h+='<h4>Ingredientes</h4><ul class="ing">'+r.i.map(it=>'<li><span>'+esc(it.name)+'</span><span>'+qtyText(roundDetail(it.q*f,it.u),it.u)+'</span></li>').join('')+'</ul>';
    h+='<h4>Pasos</h4><ol class="steps">'+r.s.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>';
    h+='<p class="meta" style="margin-top:10px">Aceite, sal y pimienta se dan por hechos.</p>';
  }else{
    h+='<h3>'+slotTitle(key)+'</h3><p class="meta">'+esc(slotLabel(key).t)+'.</p>';
  }
  h+='<div class="actions"><button class="btn" data-act="random">Otra al azar</button><button class="btn soft" data-act="pick">Elegir de la lista</button>';
  if(key.endsWith('-a')&&key!=='0-a')h+='<button class="btn soft" data-act="sobras">Sobras de la cena</button>';
  h+='<button class="btn soft" data-act="afuera">Comemos afuera</button>';

function showPicker(){

function showSettings(isNew){

  '<h4 id="pl">Personas</h4><div class="stepper" role="group" aria-labelledby="pl"><button data-p="-1" aria-label="Una persona menos">−</button><output id="pp">'+S.people+'</output><button data-p="1" aria-label="Una persona más">+</button></div>'+

    (hogar()?'<div class="actions" style="margin-top:0"><button class="btn soft" data-act="invite">Invitar</button><button class="btn soft" data-act="leave">Dejar de compartir</button></div>':'<div class="actions" style="margin-top:0"><button class="btn soft" data-act="create">Crear lista compartida</button><button class="btn soft" data-act="join">Unirme con un link</button></div>')+

sheet.addEventListener('click',e=>{
  const b=e.target.closest('#sheetBody button');if(!b)return;
  if(b.dataset.p){S.people=Math.min(12,Math.max(1,S.people+(+b.dataset.p)));document.getElementById('pp').textContent=S.people;commit([{p:['people'],v:S.people}]);render();return}
  if(b.dataset.choose){S.slots[curSlot]=b.dataset.choose;commit([{p:['slots',curSlot],v:S.slots[curSlot]}]);render();showSlot(curSlot);return}
  const a=b.dataset.act;if(!a)return;
  if(a==='random'){const used=new Set(Object.values(S.slots));const opts=R.filter(r=>!used.has(r.id));const pool=opts.length?opts:R.filter(r=>r.id!==S.slots[curSlot]);S.slots[curSlot]=pool[Math.floor(Math.random()*pool.length)].id;commit([{p:['slots',curSlot],v:S.slots[curSlot]}]);render();showSlot(curSlot)}
  else if(a==='pick')showPicker();
  else if(a==='sobras'||a==='afuera'){S.slots[curSlot]=a;commit([{p:['slots',curSlot],v:a}]);render();closeSheet()}
  else if(a==='clear'){S.slots[curSlot]=null;commit([{p:['slots',curSlot],v:null}]);render();closeSheet()}
  else if(a==='generate'){S.sobras=document.getElementById('sob').checked;S.start=iso(mondayOf(new Date()));S.slots=generate(S.sobras);S.checked={};commit([{p:['sobras'],v:S.sobras},{p:['start'],v:S.start},{p:['slots'],v:S.slots},{p:['checked'],v:{}}]);render();closeSheet();toast('Semana nueva armada')}
  else if(a==='applySettings'){const v=document.getElementById('sob').checked;if(v!==S.sobras){S.sobras=v;for(let d=1;d<7;d++){const k=d+'-a';if(v&&S.slots[k]!=='afuera')S.slots[k]='sobras';if(!v&&S.slots[k]==='sobras')S.slots[k]=null}commit([{p:['sobras'],v:S.sobras},{p:['slots'],v:S.slots}])}render();closeSheet()}
  else if(a==='backup')backup();
  else if(a==='restore')document.getElementById('restoreFile').click();
  else if(a==='create'){if(!window.ollaSync){toast('Todavía cargando, probá en unos segundos');return}b.disabled=true;window.ollaSync.create().then(()=>{showSettings(false);invite()}).catch(e=>{b.disabled=false;toast(e&&e.message==='config'?'Falta configurar Firebase':'No se pudo crear. Revisá tu conexión')})}
  else if(a==='join'){if(!window.ollaSync){toast('Todavía cargando, probá en unos segundos');return}const code=extractCode(prompt('Pegá el link que te pasaron'));if(code===null)return;if(!code){toast('Ese link no es de una lista de olla');return}if(!confirm('Tu semana y tu lista se reemplazan por las compartidas. ¿Seguimos?'))return;window.ollaSync.join(code).then(()=>showSettings(false)).catch(e=>toast(e&&e.message==='config'?'Falta configurar Firebase':'No se pudo conectar'))}
  else if(a==='invite')invite();
  else if(a==='leave'){if(!confirm('Vas a dejar de ver la lista compartida. Te queda una copia en este celu.'))return;window.ollaSync&&window.ollaSync.leave();showSettings(false)}
});

async function backup(){
  const d=new Date();const name='olla-respaldo-'+iso(d)+'.json';
  const blob=new Blob([JSON.stringify({app:'olla',v:1,saved:d.toISOString(),data:S},null,1)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Respaldo de olla'});toast('Copia lista');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Copia descargada')}
  catch(e){toast('No se pudo guardar la copia')}
}
document.getElementById('restoreFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const obj=JSON.parse(await f.text());const data=obj&&obj.data?obj.data:obj;if(!valid(data))throw 0;
    if(!confirm('Esto reemplaza tu semana y tu lista actuales por las de la copia. ¿Seguimos?'))return;
    S=normalize(data);fixMissing();commit([{full:true}]);render();closeSheet();toast('Copia restaurada')}
  catch(err){toast('Ese archivo no es una copia de olla')}
});

/* Main events */
document.getElementById('days').addEventListener('click',e=>{const b=e.target.closest('[data-slot]');if(b)showSlot(b.dataset.slot)});
document.getElementById('heroWeek').addEventListener('click',e=>{if(e.target.closest('#openSettings'))showSettings(false);if(e.target.closest('[data-hero="new"]'))showSettings(true)});
document.getElementById('newWeek').onclick=()=>showSettings(true);
document.getElementById('heroList').addEventListener('click',e=>{if(e.target.closest('#share'))shareList()});
document.getElementById('list').addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;if(e.target.checked){S.checked[k]=true;commit([{p:['checked',k],v:true}])}else{delete S.checked[k];commit([{p:['checked',k],del:true}])}renderList()});
document.getElementById('list').addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){const id=rm.dataset.rm;S.extras=S.extras.filter(x=>x.id!==id);delete S.checked['x:'+id];commit([{p:['extras'],v:S.extras},{p:['checked','x:'+id],del:true}]);renderList();return}
  if(e.target.id==='exAdd')addExtra();
  if(e.target.id==='uncheck'){S.checked={};commit([{p:['checked'],v:{}}]);renderList()}
});
document.getElementById('list').addEventListener('keydown',e=>{if(e.target.id==='exName'&&e.key==='Enter')addExtra()});
function addExtra(){const n=document.getElementById('exName');const v=n.value.trim();if(!v){n.focus();return}S.extras.push({id:uid(),name:v,sec:document.getElementById('exSec').value});commit([{p:['extras'],v:S.extras}]);renderList();document.getElementById('exName').value='';document.getElementById('exName').focus()}

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.getElementById('v-semana').hidden=b.dataset.tab!=='semana';
  document.getElementById('v-compras').hidden=b.dataset.tab!=='compras';
  window.scrollTo(0,0);
});

function listText(){
  const all=buildList().concat(S.extras.map(e=>({key:'x:'+e.id,name:e.name,sec:e.sec})));
  let t='Compras de la semana\n';
  for(const s of SECTORS){if(s.id==='alacena')continue;const xs=all.filter(x=>x.sec===s.id&&!S.checked[x.key]).sort((a,b)=>a.name.localeCompare(b.name,'es'));if(!xs.length)continue;t+='\n'+s.name+'\n'+xs.map(x=>'- '+x.name+(x.u?' ('+qtyText(x.q,x.u)+')':'')).join('\n')+'\n'}
  return t;
}
async function shareList(){
  const t=listText();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Lista copiada')}catch(e){openSheet('<h3>Copiá tu lista</h3><textarea class="field" style="height:50vh;margin-top:12px" readonly>'+esc(t)+'</textarea>')}
}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1800)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderWeek()});
function extractCode(t){if(t===null||t===undefined)return null;t=String(t).trim();const m=t.match(/hogar=([a-z0-9]{24,})/i)||t.match(/^([a-z0-9]{24,})$/i);return m?m[1].toLowerCase():''}
async function invite(){const code=hogar();if(!code)return;const url=location.origin+location.pathname+'#hogar='+code;
  try{if(navigator.share){await navigator.share({title:'olla',text:'Sumate a nuestra lista de comidas y compras en olla. Instalá la app y en Ajustes tocá “Unirme con un link”:',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch(e){openSheet('<h3>Link para invitar</h3><textarea class="field" style="height:120px;margin-top:12px" readonly>'+esc(url)+'</textarea>')}}
window.ollaHooks={getState:()=>S,setState:d=>{S=normalize(d);fixMissing();save();render()},onStatus:st=>{const el=document.getElementById('syncStatus');if(el)el.textContent=SYNC_TEXT[st]||'';renderList()}};

save();render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
<script type="module">
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const HKEY='olla-hogar';
const H=window.ollaHooks;
let F=null,db=null,ref=null,unsub=null,booting=null;
const sync={status:'local',apply,create,join,leave};
window.ollaSync=sync;
function setStatus(s){sync.status=s;H.onStatus(s)}
function getSaved(){try{return localStorage.getItem(HKEY)}catch(e){return null}}
function setSaved(c){try{c?localStorage.setItem(HKEY,c):localStorage.removeItem(HKEY)}catch(e){}}
function clean(o){return o===undefined?null:JSON.parse(JSON.stringify(o))}
function snapshotOf(S){return clean({people:S.people,sobras:S.sobras,start:S.start,slots:S.slots,checked:S.checked,extras:S.extras})}
function randomCode(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
function boot(){
  if(!booting){booting=(async()=>{
    const c=window.OLLA_CONFIG;if(!c||!c.apiKey||!c.projectId)throw new Error('config');
    const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=a.initializeApp(c);const auth=au.getAuth(app);
    await auth.authStateReady();if(!auth.currentUser)await au.signInAnonymously(auth);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    F=fs;
  })();booting.catch(()=>{booting=null})}
  return booting;
}
async function start(){setStatus('connecting');try{await boot()}catch(e){setStatus(e&&e.message==='config'?'config':'error');throw e}}
async function connect(code){
  await start();
  if(unsub)unsub();
  ref=F.doc(db,'hogares',code);
  unsub=F.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
    if(!snap.exists()){if(!snap.metadata.fromCache)setStatus('missing');return}
    if(!snap.metadata.hasPendingWrites)H.setState(snap.data());
    setStatus(snap.metadata.fromCache?'offline':'ok');
  },()=>setStatus('error'));
}
function apply(ops){
  if(!ref||!F)return;
  if(ops.some(o=>o.full)){F.setDoc(ref,snapshotOf(H.getState())).catch(()=>{});return}
  const args=[];for(const o of ops)args.push(new F.FieldPath(...o.p),o.del?F.deleteField():clean(o.v));
  F.updateDoc(ref,...args).catch(()=>{});
}
async function create(){
  const code=randomCode();await start();
  await F.setDoc(F.doc(db,'hogares',code),snapshotOf(H.getState()));
  setSaved(code);await connect(code);return code;
}
async function join(code){setSaved(code);await connect(code)}
function leave(){if(unsub)unsub();unsub=null;ref=null;setSaved(null);setStatus('local')}

const saved=getSaved();
const m=location.hash.match(/hogar=([a-z0-9]{24,})/i);
if(m){
  history.replaceState(null,'',location.pathname+location.search);
  const code=m[1].toLowerCase();
  if(code!==saved&&confirm('Te invitaron a una lista compartida de olla. Tu semana y tu lista se reemplazan por las compartidas. ¿Te sumás?')){join(code).catch(()=>{})}
  else if(saved)connect(saved).catch(()=>{});
}else if(saved){connect(saved).catch(()=>{})}
</script>
